name: GCP authentication

on:
  workflow_dispatch:

jobs:
  gcp:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/771032250705/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: cgep-grc-gate-sa@adept-sentinel-425907-i4.iam.gserviceaccount.com

      - run: gcloud storage ls